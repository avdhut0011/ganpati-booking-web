version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ganpati-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/ganpati.db
      - JWT_SECRET=${JWT_SECRET:-ganpati-super-secure-production-secret-2026}
      - JWT_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:5173", "http://localhost:8000"]
      - USE_CLOUD_STORAGE=${USE_CLOUD_STORAGE:-false}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-}
      - AWS_CLOUDFRONT_DOMAIN=${AWS_CLOUDFRONT_DOMAIN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend/ganpati.db:/app/ganpati.db
      - ./backend/static/uploads:/app/static/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ganpati-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
